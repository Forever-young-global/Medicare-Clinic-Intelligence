{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">ACCESS CONTROL</p><h1>Clinic users</h1></div></div><div class="detail-grid"><section class="panel"><h2>Active accounts</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td><span class="badge">{{ u.role.value }}</span></td></tr>{% endfor %}</tbody></table></div></section><section class="panel"><h2>Add user</h2><form method="post" class="stack"><label>Full name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label><label>Temporary password<input type="password" name="password" minlength="10" required></label><label>Role<select name="role"><option value="doctor">Doctor</option><option value="receptionist">Receptionist</option><option value="admin">Administrator</option></select></label><button>Create account</button></form></section></div>
{% endblock %}
